name: build

# Every push and pull request: run the tests and build the exe.
# A tag like v0.2.0: also publish a GitHub release with Spacewise.exe attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests --nologo

      - name: Build Spacewise.exe
        run: dotnet publish Spacewise.csproj -c Release --nologo -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Spacewise
          path: out/Spacewise.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Spacewise

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Spacewise.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spacewise $GITHUB_REF_NAME" \
            --generate-notes
